name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  symbol-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check pre-commit pyyaml
      - name: Run the same hooks as a local commit
        run: pre-commit run --all-files
      - name: Winding-curl lint tests
        run: python -m unittest test_kicad_sym_lint.py
        working-directory: tools
